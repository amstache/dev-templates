[project]
name = "app"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.5",
]

[project.scripts]
app = "app:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.168.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "UP", "B", "SIM", "C4", "RET", "PT", "RUF",
  "ANN",   # require annotations; ANN401 bans `Any`
  "BLE",   # blind `except Exception`
  "S",     # bandit security checks
  "T20",   # stray print()
  "ERA",   # commented-out code
  "PGH",   # blanket `# type: ignore` / `# noqa`
  "TID",   # banned APIs (below)
  "DTZ",   # naive datetimes
  "PTH",   # os.path -> pathlib
  "ASYNC", # blocking calls in async code
  "C90",   # cyclomatic complexity
  "PL",    # pylint subset
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.cast".msg = "Fix the types instead of casting."

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pyright]
typeCheckingMode = "strict"
enableTypeIgnoreComments = false

[tool.pytest]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra", "--cov"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
